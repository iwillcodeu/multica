# Seat dashboard (排座): separate server_name from Multica (pmo.atuofuture.com).
# TLS: run `sudo certbot --nginx -d seat.atuofuture.com` after DNS points here.
#
# Copy to server, e.g.:
#   sudo cp nginx-seat.atuofuture.conf /etc/nginx/sites-available/seat.atuofuture.com
#   sudo ln -sf ../sites-available/seat.atuofuture.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name seat.atuofuture.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
